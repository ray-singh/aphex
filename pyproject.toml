[project]
name = "aphex-ml"
version = "0.1.0a1"
description = "Hardware-aware ML deployment optimization and recommendation framework"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["machine-learning", "deployment", "optimization", "inference", "mlops", "benchmarking"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "psutil>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/ray-singh/aphex"
"Bug Tracker" = "https://github.com/ray-singh/aphex/issues"

[project.optional-dependencies]
torch = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchinfo>=1.8.0",
]
sklearn = ["scikit-learn>=1.3.0"]
tensorflow = ["tensorflow>=2.15.0"]
onnx = [
    "onnx>=1.17.0",
    "onnxruntime>=1.17.0",
]
cuda = ["pynvml>=11.5.0"]
aws  = ["boto3>=1.34.0"]
gcp  = ["google-cloud-storage>=2.16.0"]
full = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchinfo>=1.8.0",
    "scikit-learn>=1.3.0",
    "tensorflow>=2.15.0",
    "onnx>=1.17.0",
    "onnxruntime>=1.17.0",
    "pynvml>=11.5.0",
    "boto3>=1.34.0",
    "google-cloud-storage>=2.16.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.scripts]
aphex = "infermap.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["infermap"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]
ignore = [
    "E501",   # line length is enforced by formatter
    "S101",   # assert is fine in tests
    "S301",   # pickle warnings — opt-in via APHEX_TRUST_PICKLE
    "S403",   # importing pickle is fine
    "S404",   # subprocess use is intentional in cloud/remote
    "S603",   # subprocess call without shell=True; we already construct args as a list
    "S607",   # ssh/scp via PATH lookup is the correct UX (uses user's SSH config)
    "B008",   # typer.Option(...) in defaults — required by Typer
    "B904",   # raise from inside except — many sites are user-facing CLI exits
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S301", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Structural checks kept on; suppress noise from untyped torch/sklearn internals
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
disable_error_code = [
    "type-arg",        # generic aliases without params (common in dynamic ML code)
    "no-any-return",   # returns from untyped torch ops
    "no-untyped-call", # torch.jit.trace, prune.*, cuda.Event — all untyped stubs
    "no-untyped-def",  # introspection helpers with deliberately loose signatures
]

[tool.coverage.run]
source = ["infermap"]
omit = ["infermap/serving/**", "tests/**"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "requires_cuda: skips if CUDA is not available",
    "requires_mps: skips if MPS is not available",
    "requires_cpu: always runs (CPU path)",
    "integration: real-model tests that download weights; excluded by default — run with: pytest -m integration",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
]
